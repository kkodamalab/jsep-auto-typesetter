<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="日本語原稿をブラウザだけで縦書き組版するツール">
    <title>JSEP Auto Typesetter</title>
    <link rel="stylesheet" href="src/style.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="JSEP Auto Typesetter ホーム">
        <span class="brand-mark">縦</span><span>JSEP <b>Auto Typesetter</b></span>
      </a>
      <button id="print-button" class="primary" type="button">PDFに保存 / 印刷</button>
    </header>
    <main>
      <section class="hero">
        <p class="eyebrow">JAPANESE VERTICAL TYPESETTING</p>
        <h1>原稿を、読みやすい<br><em>縦書き</em>へ。</h1>
        <p>文章を入力するだけで、ページごとに自動組版。データはブラウザの外へ送信されません。</p>
      </section>
      <section class="workspace" aria-label="組版ワークスペース">
        <aside class="editor-panel">
          <div class="panel-heading"><div><span class="step">01</span><h2>原稿</h2></div><span id="character-count">0 字</span></div>
          <label class="sr-only" for="manuscript">原稿本文</label>
          <textarea id="manuscript" spellcheck="true">春は、あけぼの。やうやう白くなりゆく山ぎは、少しあかりて、紫だちたる雲の細くたなびきたる。&#10;&#10;夏は、夜。月のころはさらなり、闇もなほ、蛍の多く飛びちがひたる。</textarea>
          <div class="settings">
            <div><span class="step">02</span><h2>組版設定</h2></div>
            <label>一行の文字数 <output id="chars-output">20</output><input id="chars-per-line" type="range" min="10" max="30" value="20"></label>
            <label>一頁の行数 <output id="lines-output">18</output><input id="lines-per-page" type="range" min="8" max="24" value="18"></label>
          </div>
        </aside>
        <section class="preview-panel">
          <div class="panel-heading"><div><span class="step">03</span><h2>プレビュー</h2></div><span id="page-count">1 ページ</span></div>
          <div id="preview" class="preview" aria-live="polite"></div>
        </section>
      </section>
    </main>
    <footer>JSEP Auto Typesetter · 入力内容は端末内で処理されます</footer>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
