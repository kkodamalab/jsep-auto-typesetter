<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="JSEP学術論文自動組版システム"><title>JSEP Auto Typesetter</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><b>JSEP</b><span>Auto Typesetter</span></div><span id="mode" class="badge">接続確認中</span></header><main><section class="intro"><p class="eyebrow">ACADEMIC PUBLISHING WORKFLOW</p><h1>原稿から、出版可能な論文へ。</h1><p>Word原稿を解析し、内容を確認してから、日本語学術論文PDFを生成します。</p></section>
<div id="notice" class="notice" hidden></div><section class="steps"><article><span>01 / IMPORT</span><h2>Word原稿</h2><label id="drop" class="drop"><input id="file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><b>.docxを選択</b><small>最大25MB・サーバーに永続保存しません</small></label><button id="demo">架空のデモ原稿を読み込む</button></article>
<article class="editor"><span>02 / REVIEW</span><h2>抽出結果を確認・編集</h2><label>タイトル<input id="title"></label><label>著者情報<textarea id="authors" rows="3" placeholder="氏名 | 所属（1行に1名）"></textarea></label><label>抄録<textarea id="abstract" rows="5"></textarea></label><label>本文・見出し・図表・数式・参考文献<textarea id="body" rows="18"></textarea></label></article>
<article><span>03 / TYPESET</span><h2>仮テンプレート</h2><label>本文サイズ <select id="font"><option>9</option><option selected>10.5</option><option>12</option></select> pt</label><label>余白 <input id="margin" type="number" min="15" max="35" value="22"> mm</label><div id="warnings"></div><button id="pdf" class="primary">PDFを生成</button><p class="help">Pandoc → LuaLaTeX（luatexja）で処理します。</p></article></section></main><footer>原稿を外部AIへ送信しません · 一時ファイルは処理後に削除されます</footer><script type="module" src="app.js"></script></body></html>
