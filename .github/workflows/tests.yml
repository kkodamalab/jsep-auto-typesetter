name: Test conversion pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests from repository root
        run: python -m pytest -m "not integration" -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build integration test image
        run: docker build --target test -t jsep-typesetter-test .
      - name: Run integration test in production toolchain image
        run: |
          mkdir -p test-artifacts
          chmod 777 test-artifacts
          docker run --rm -v "$PWD/test-artifacts:/app/test-artifacts" jsep-typesetter-test
      - name: Upload PDF and rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typesetting-preview
          path: test-artifacts/
          if-no-files-found: error
          retention-days: 14
